# Netlify erkennt Next.js automatisch (OpenNext-Adapter).
# Vor dem Build werden die Drizzle-Migrationen auf DATABASE_URL angewendet (idempotent).
# Runde 1 und die Seed-Taxonomie entstehen beim ersten Aufruf des Admin-Dashboards.
[build]
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
